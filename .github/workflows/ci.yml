name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Test fnOS data permission migration
        run: sudo "$(command -v node)" --test scripts/fnos-permissions.test.js
      - run: node --check public/app.js && node --check server/index.js && node --check server/probe.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle -p android --no-daemon :app:assembleDebug
