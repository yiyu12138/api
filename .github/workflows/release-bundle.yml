name: Release update bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/api-balance.p12"
          echo "ANDROID_KEY_ALIAS=$(keytool -list -v -J-Duser.language=en -storetype PKCS12 -keystore "$RUNNER_TEMP/api-balance.p12" -storepass "$ANDROID_STORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/api-balance.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle -p android --no-daemon :app:assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk api-balance.apk
      - name: Build Git bundle
        run: git bundle create "api-balance-${GITHUB_REF_NAME}.bundle" "refs/tags/${GITHUB_REF_NAME}"
      - name: Build fnOS package
        run: |
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o "$RUNNER_TEMP/fnpack"
          chmod +x "$RUNNER_TEMP/fnpack"
          FNPACK_BIN="$RUNNER_TEMP/fnpack" npm run build:fpk
      - name: Build release notes
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## 更新内容"
            if [ -n "$previous_tag" ]; then
              git log --no-merges --pretty='- %s' "$previous_tag..$GITHUB_REF_NAME"
              echo
              echo "**完整更新日志**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
            else
              echo "- 首次发布"
            fi
          } > release-notes.md
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "api-balance-${GITHUB_REF_NAME}.bundle" api-balance.apk dist/*.fpk --clobber
